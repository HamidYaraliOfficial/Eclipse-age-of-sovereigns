<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#08111f" />
    <meta name="author" content="Hamid Yareli" />
    <meta name="copyright" content="Copyright © 2026 Hamid Yareli. All rights reserved." />
    <meta name="description" content="ECLIPSE: AGE OF SOVEREIGNS — a 3D grand-strategy game by Hamid Yareli." />
    <title>ECLIPSE: AGE OF SOVEREIGNS</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <div id="app" class="app">
      <header class="topbar">
        <div class="brand-lockup">
          <div class="brand-mark" aria-hidden="true"><span></span></div>
          <div><div class="brand-name">ECLIPSE</div><div class="brand-subtitle">AGE OF SOVEREIGNS</div></div>
        </div>
        <div class="topbar-center"><span class="season-mark"></span><span id="world-era">THE SOVEREIGN AGE · YEAR 01</span></div>
        <div class="topbar-actions">
          <label class="language-label" for="language-select">Language</label>
          <select id="language-select" aria-label="Language"><option value="en">English</option><option value="fa">فارسی</option><option value="zh">中文</option></select>
          <button class="icon-button" id="save-button" title="Save game" aria-label="Save game">◧</button>
          <button class="icon-button" id="load-button" title="Load game" aria-label="Load game">↶</button>
          <button class="icon-button" id="help-button" title="Help" aria-label="Help">?</button>
        </div>
      </header>

      <section class="resource-strip" id="resource-strip" aria-label="Nation resources"></section>

      <main class="game-layout">
        <aside class="left-rail panel" id="left-panel"></aside>

        <section class="world-stage" aria-label="3D world map">
          <canvas id="game-canvas" tabindex="0" aria-label="Interactive three-dimensional strategy map"></canvas>
          <div class="stage-topline">
            <div class="world-title-block"><span class="eyebrow" id="stage-eyebrow">WORLD COMMAND</span><h1 id="stage-title">The Known World</h1><p id="stage-caption">An uncertain age. A new power rises.</p></div>
            <div class="stage-coordinate"><span class="live-dot"></span><span id="stage-status">SIMULATION LIVE</span></div>
          </div>
          <div class="map-tools" id="map-tools">
            <button data-action="zoom-in" title="Zoom in">＋</button>
            <button data-action="zoom-out" title="Zoom out">−</button>
            <button data-action="reset-camera" title="Reset camera">⌖</button>
            <span class="tool-divider"></span>
            <button data-action="toggle-labels" title="Toggle city labels">◉</button>
          </div>
          <div class="map-legend"><span><i class="legend-dot player-dot"></i><b id="legend-player">AURELIA</b></span><span><i class="legend-dot neutral-dot"></i><span id="legend-neutral">Independent territory</span></span><span><i class="legend-dot city-dot"></i><span id="legend-city">Major city</span></span></div>
          <div class="stage-footer"><span id="map-hint">DRAG TO ROTATE · SCROLL TO ZOOM · SELECT A TILE</span><span id="map-coordinates">GRID 24 × 18</span></div>
          <div id="toast-region" class="toast-region" aria-live="polite"></div>
        </section>

        <aside class="right-rail panel" id="right-panel"></aside>
      </main>

      <footer class="command-bar" id="command-bar"></footer>
      <div id="modal-root"></div>
      <input type="file" id="save-file-input" accept="application/json,.json" hidden />
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
